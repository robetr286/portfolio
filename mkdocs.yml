site_name: Robert Bąk — Portfolio
site_author: Robert Bąk
site_description: >-
    Portfolio of Data Science, AI and software engineering projects

repo_name: robetr286/portfolio
repo_url: https://github.com/robetr286/portfolio

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: light green
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: fontawesome/solid/microchip
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: Robert Bąk — Portfolio
          site_description: Portfolio of Data Science, AI and software engineering projects
          nav_translations:
            Home: Home
            Projects: Projects
            Talk Electronics: Talk Electronics
        - locale: pl
          name: Polski
          build: true
          site_name: Robert Bąk — Portfolio
          site_description: Portfolio projektów z Data Science, AI i inżynierii oprogramowania
          nav_translations:
            Home: Strona główna
            Projects: Projekty
            Talk Electronics: Talk Electronics

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
- Home: index.md
- Projects:
  - Talk Electronics: Talk_electronics/index.md
