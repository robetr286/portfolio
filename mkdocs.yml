site_name: Robert Bąk — Portfolio
site_author: Robert Bąk
site_description: >-
    Portfolio projektów z Data Science, AI i inżynierii oprogramowania

repo_name: robetr286/portfolio
repo_url: https://github.com/robetr286/portfolio

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: light green
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: fontawesome/solid/microchip
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
- Strona główna: index.md
- Projekty:
  - Talk Electronics: Talk_electronics/index.md

  
