site_name: Porfolio
site_author: Robert Bąk
site_description: >-
    Portfolio moich projektów z Data Science i AI!

repo_name: robetr286/portfolio
repo_url: https://github.com/robetr286/portfolio

theme:
  name: material
  palette:
    primary: lime
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - attr_list
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
- Obecny projekt:
  - "Talk_electronic": Talk_electronics/index.md

  
